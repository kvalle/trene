appId: no.kvalle.trene
---
- tapOn: "Browse"
- extendedWaitUntil:
    visible:
      id: "DOC.sidebar.item.On My iPhone"
    timeout: 30000
- tapOn:
    id: "DOC.sidebar.item.On My iPhone"
- extendedWaitUntil:
    visible:
      id: "DOC.browsingRoot.*Title: On My iPhone"
    timeout: 30000
- tapOn: "Trene"
- extendedWaitUntil:
    visible:
      id: "DOC.browsingRoot.*Title: Trene"
    timeout: 30000
- extendedWaitUntil:
    visible: "${BACKUP_FILE}"
    timeout: 30000
- tapOn: "${BACKUP_FILE}"
