appId: com.kjetilvalle.trene
name: Roll back a failed iOS restore
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Øvelser"
- extendedWaitUntil:
    visible: "Opprett første øvelse"
    timeout: 30000
- tapOn: "Opprett første øvelse"
- waitForAnimationToEnd
- tapOn:
    id: "exercise-name-input"
- inputText: "Beholdes"
- tapOn:
    id: "create-exercise-submit"
- waitForAnimationToEnd
- assertVisible: "Beholdes"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 60000
- tapOn: "Start økt"
- waitForAnimationToEnd
- tapOn: "Legg til øvelse"
- waitForAnimationToEnd
- tapOn: "Beholdes"
- waitForAnimationToEnd
- tapOn: "Belastning"
- inputText: "42.5"
- tapOn: "Repetisjoner"
- inputText: "6"
- tapOn: "Bekreft planlagt sett for Beholdes"
- waitForAnimationToEnd
- tapOn: "Ferdig"
- extendedWaitUntil:
    visible: "Fullfør økt"
    timeout: 30000
- tapOn: "Fullfør økt"
- waitForAnimationToEnd
- tapOn: "Tilbake til forsiden"
- waitForAnimationToEnd
- tapOn: "Innstillinger"
- waitForAnimationToEnd
- tapOn:
    id: "settings-data"
- waitForAnimationToEnd
- tapOn:
    id: "restore-from-file"
- runFlow:
    file: select-backup-file.yaml
    env:
      BACKUP_FILE: representative.trene-backup
- extendedWaitUntil:
    visible:
      id: "restore-preview"
    timeout: 30000
- tapOn:
    id: "continue-restore"
- extendedWaitUntil:
    visible:
      id: "restore-confirmation"
    timeout: 30000
- tapOn:
    id: "confirm-restore"
- extendedWaitUntil:
    visible: "Gjenopprettingen mislyktes. De opprinnelige dataene er kontrollert og gjenopprettet."
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 60000
- tapOn: "Øvelser"
- waitForAnimationToEnd
- assertVisible: "Beholdes.*"
- assertNotVisible: "Knebøy.*"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 60000
- tapOn: "Tidligere økter"
- waitForAnimationToEnd
- tapOn: ".*, 1 øvelse"
- waitForAnimationToEnd
- assertVisible: "Sett 1, 6 repetisjoner med 42,5 kilogram"
