appId: no.kvalle.trene
name: Roll back a failed iOS restore
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Øvelser"
- tapOn: "Opprett første øvelse"
- tapOn:
    id: "exercise-name-input"
- inputText: "Beholdes"
- tapOn:
    id: "create-exercise-submit"
- back
- back
- tapOn: "Start økt"
- tapOn: "Legg til øvelse"
- tapOn: "Beholdes"
- tapOn: "Belastning"
- inputText: "42.5"
- tapOn: "Repetisjoner"
- inputText: "6"
- tapOn: "Bekreft"
- tapOn: "Ferdig"
- tapOn: "Fullfør økt"
- tapOn: "Tilbake til forsiden"
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- tapOn:
    id: "restore-from-file"
- tapOn: "representative.trene-backup"
- extendedWaitUntil:
    visible:
      id: "restore-preview"
    timeout: 30000
- tapOn:
    id: "continue-restore"
- assertVisible:
    id: "restore-confirmation"
- tapOn:
    id: "confirm-restore"
- extendedWaitUntil:
    visible: "Gjenopprettingen mislyktes. De opprinnelige dataene er kontrollert og gjenopprettet."
    timeout: 30000
- back
- back
- tapOn: "Øvelser"
- assertVisible: "Beholdes"
- assertNotVisible: "Knebøy"
- back
- tapOn: "Tidligere økter"
- tapOn: ".*, 1 øvelse"
- assertVisible: "42,5 kg · 6 repetisjoner"
