appId: com.kjetilvalle.trene
name: Cancel iOS backup selection
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Innstillinger"
- waitForAnimationToEnd
- tapOn:
    id: "settings-data"
- waitForAnimationToEnd
- tapOn:
    id: "restore-from-file"
- extendedWaitUntil:
    visible: "(Recents|Browse|Cancel)"
    timeout: 30000
- tapOn: "Cancel"
- waitForAnimationToEnd
- assertVisible:
    id: "restore-from-file"
- assertNotVisible:
    id: "data-error"
