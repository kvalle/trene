appId: no.kvalle.trene
name: Cancel iOS backup selection
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- tapOn:
    id: "restore-from-file"
- extendedWaitUntil:
    visible: "representative.trene-backup"
    timeout: 30000
- tapOn: "Cancel"
- assertVisible:
    id: "restore-from-file"
- assertNotVisible:
    id: "data-error"
