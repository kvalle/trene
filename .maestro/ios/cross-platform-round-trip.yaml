appId: com.kjetilvalle.trene
name: Restore and re-export a cross-platform backup on iOS
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Innstillinger"
- tapOn: { id: "settings-data" }
- extendedWaitUntil:
    visible: { id: "restore-from-file" }
    timeout: 30000
- tapOn: { id: "restore-from-file" }
- runFlow:
    file: select-backup-file.yaml
    env: { BACKUP_FILE: representative.trene-backup }
- extendedWaitUntil:
    visible: { id: "restore-preview" }
    timeout: 30000
- assertVisible: "1 treningsøkter"
- assertVisible: "2 øvelser"
- tapOn: { id: "continue-restore" }
- extendedWaitUntil:
    visible: { id: "restore-confirmation" }
    timeout: 30000
- tapOn: { id: "confirm-restore" }
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000
- tapOn: "Øvelser"
- assertVisible: "Knebøy.*"
- assertVisible: "Markløft.*"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000
- tapOn: "Innstillinger"
- tapOn: { id: "settings-data" }
- extendedWaitUntil:
    visible: { id: "create-backup" }
    timeout: 30000
- tapOn: { id: "create-backup" }
- extendedWaitUntil:
    visible: "Copy"
    timeout: 60000
- tapOn: { id: "PopoverDismissRegion" }
- assertVisible: { id: "create-backup" }
