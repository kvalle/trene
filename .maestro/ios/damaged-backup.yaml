appId: no.kvalle.trene
name: Reject a damaged backup on iOS
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Øvelser"
- tapOn: "Opprett første øvelse"
- tapOn:
    id: "exercise-name-input"
- inputText: "Beholdes"
- tapOn:
    id: "create-exercise-submit"
- assertVisible: "Beholdes"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- tapOn:
    id: "restore-from-file"
- runFlow:
    file: select-backup-file.yaml
    env:
      BACKUP_FILE: damaged.trene-backup
- extendedWaitUntil:
    visible: "Sikkerhetskopien er skadet eller kan ikke leses. Dataene dine er ikke endret."
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000
- tapOn: "Øvelser"
- assertVisible: "Beholdes"
