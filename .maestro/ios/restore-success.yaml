appId: com.kjetilvalle.trene
name: Restore a synthetic backup on iOS
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Øvelser"
- extendedWaitUntil:
    visible: "Opprett første øvelse"
    timeout: 30000
- tapOn: "Opprett første øvelse"
- tapOn:
    id: "exercise-name-input"
- inputText: "Utdatert"
- tapOn:
    id: "create-exercise-submit"
- extendedWaitUntil:
    visible: "Utdatert"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- assertVisible:
    id: "create-backup"
- assertVisible:
    id: "restore-from-file"
- tapOn:
    id: "restore-from-file"
- runFlow:
    file: select-backup-file.yaml
    env:
      BACKUP_FILE: representative.trene-backup
- extendedWaitUntil:
    visible:
      id: "restore-preview"
    timeout: 30000
- assertVisible:
    id: "restore-preview-workouts"
- assertVisible:
    id: "restore-preview-exercises"
- assertVisible: "Ingenting er gjenopprettet ennå."
- tapOn:
    id: "continue-restore"
- extendedWaitUntil:
    visible:
      id: "restore-confirmation"
    timeout: 30000
- assertVisible: "Dette erstatter alle data i Trene og kan ikke angres."
- tapOn:
    id: "confirm-restore"
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000
- tapOn: "Øvelser"
- assertVisible: "Knebøy.*"
- assertVisible: "Markløft.*"
- assertNotVisible: "Utdatert.*"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000
- tapOn: "Øvelser"
- assertVisible: "Knebøy.*"
- assertVisible: "Markløft.*"
- assertNotVisible: "Utdatert.*"
