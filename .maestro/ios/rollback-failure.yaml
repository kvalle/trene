appId: com.kjetilvalle.trene
name: Safely stop after iOS restore and rollback failure
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- tapOn:
    id: "restore-from-file"
- runFlow:
    file: select-backup-file.yaml
    env:
      BACKUP_FILE: representative.trene-backup
- extendedWaitUntil:
    visible:
      id: "restore-preview"
    timeout: 30000
- tapOn:
    id: "continue-restore"
- assertVisible: "Dette erstatter alle data i Trene og kan ikke angres."
- tapOn:
    id: "confirm-restore"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Trene kan ikke åpne dataene trygt"
    timeout: 30000
- assertVisible: "Gjenopprettingen ble avbrutt, og ingen av databasene kunne bekreftes. Dataene er bevart for hjelp med gjenoppretting."
- assertNotVisible: "Klar for en økt?"
