appId: com.kjetilvalle.trene
name: Reject a newer backup on iOS
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Øvelser"
- extendedWaitUntil:
    visible: "Opprett første øvelse"
    timeout: 30000
- tapOn: "Opprett første øvelse"
- waitForAnimationToEnd
- tapOn:
    id: "exercise-name-input"
- inputText: "Beholdes"
- tapOn:
    id: "create-exercise-submit"
- waitForAnimationToEnd
- assertVisible: "Beholdes"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000
- tapOn: "Innstillinger"
- waitForAnimationToEnd
- tapOn:
    id: "settings-data"
- waitForAnimationToEnd
- tapOn:
    id: "restore-from-file"
- runFlow:
    file: select-backup-file.yaml
    env:
      BACKUP_FILE: newer.trene-backup
- extendedWaitUntil:
    visible: "Sikkerhetskopien krever en nyere versjon av Trene. Dataene dine er ikke endret."
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000
- tapOn: "Øvelser"
- waitForAnimationToEnd
- assertVisible: "Beholdes.*"
