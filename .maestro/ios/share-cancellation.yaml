appId: com.kjetilvalle.trene
name: Cancel iOS backup sharing
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Innstillinger"
- waitForAnimationToEnd
- tapOn:
    id: "settings-data"
- waitForAnimationToEnd
- tapOn:
    id: "create-backup"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 60000
- tapOn:
    id: "PopoverDismissRegion"
- waitForAnimationToEnd
- assertVisible:
    id: "create-backup"
- assertNotVisible: "lagret"
