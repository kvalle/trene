appId: no.kvalle.trene
name: Start and persist a workout
tags:
  - smoke
  - android
---
- launchApp:
    clearState: true

- tapOn: "Start økt"
- assertVisible: "Ingen øvelser lagt til ennå"
- assertVisible: "Ferdig"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett første øvelse"

- tapOn:
    id: "exercise-name-input"
- setClipboard: "Knebøy"
- pasteText
- tapOn:
    id: "create-exercise-submit"

- assertVisible: "Knebøy"
- assertVisible: "Planlagt sett"
- assertVisible: "Belastning"
- assertVisible: "Repetisjoner"

- tapOn: "Belastning"
- inputText: "80.5"
- tapOn: "Repetisjoner"
- inputText: "5"
- tapOn: "Bekreft"
- assertVisible: "Sett 1"
- assertVisible: "80,5 kg · 5 repetisjoner"

# Restart the native process without clearing SQLite.
- stopApp
- launchApp

- assertVisible: "Fortsett økt"
- tapOn: "Fortsett økt"
- assertVisible: "Knebøy"
- assertVisible: "Sett 1"
- assertVisible: "80,5 kg · 5 repetisjoner"
- tapOn: "Rediger"
- assertVisible: "Planlagt sett"
- assertVisible: "80,5"
- assertVisible: "5"
- tapOn: "Bekreft"
- assertVisible: "Sett 1"

- tapOn: "Avbryt"
- assertVisible: "Avbryt økten?"
- assertVisible: "Økten slettes permanent og vises ikke i historikken."
- tapOn: "Behold økten"
- assertVisible: "Knebøy"

- tapOn: "Avbryt"
- tapOn: "Avbryt økten"
- assertVisible: "Start økt"
