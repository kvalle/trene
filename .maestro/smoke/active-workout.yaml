appId: com.kjetilvalle.trene
name: Active workout dense, busy, and cancellation states
tags:
  - smoke
  - android
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Start økt"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett første øvelse"
- tapOn:
    id: "exercise-name-input"
- setClipboard: "Knebøy"
- pasteText
- tapOn:
    id: "create-exercise-submit"
- assertVisible: "Planlagt sett"
- tapOn: "Belastning"
- inputText: "80"
- tapOn: "Repetisjoner"
- inputText: "5"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Bekreft"
    direction: DOWN
- tapOn: "Bekreft"
- assertVisible: "Sett 1"
- tapOn: "Legg til sett"
- assertVisible: "Planlagt sett"
- scrollUntilVisible:
    element:
      text: "Avbryt"
    direction: DOWN
- tapOn: "Avbryt"
- assertVisible: "Avbryt økten?"
- tapOn: "Behold økten"
- scrollUntilVisible:
    element:
      text: "Knebøy"
    direction: UP
- scrollUntilVisible:
    element:
      text: "Avbryt"
    direction: DOWN
- tapOn: "Avbryt"
- tapOn: "Avbryt økten"
- assertVisible: "Start økt"
