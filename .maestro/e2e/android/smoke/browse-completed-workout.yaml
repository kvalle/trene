appId: com.kjetilvalle.trene
name: Browse a completed workout
tags:
  - smoke
  - android
---
- launchApp

- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Tidligere økter"
- assertVisible: "Ingen fullførte økter ennå"
- assertVisible: "Start økt"
- tapOn: "Start økt"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett første øvelse"

- tapOn:
    id: "exercise-name-input"
- setClipboard: "Knebøy"
- pasteText
- tapOn:
    id: "create-exercise-submit"

- tapOn: "Belastning"
- inputText: "80"
- scrollUntilVisible:
    element:
      text: "Repetisjoner"
    direction: DOWN
    centerElement: true
- tapOn: "Repetisjoner"
- inputText: "5"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Bekreft planlagt sett for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Bekreft planlagt sett for Knebøy"
- extendedWaitUntil:
    visible: "80 kg · 5 repetisjoner"
    timeout: 30000
- tapOn: "Ferdig"
- extendedWaitUntil:
    visible: "Fullfør økten?"
    timeout: 30000
- tapOn: "Fullfør økt"
- extendedWaitUntil:
    visible: "Fullført økt"
    timeout: 30000
- assertVisible: "Knebøy"
- tapOn: "Tilbake til forsiden"
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000

- tapOn: "Tidligere økter"
- extendedWaitUntil:
    visible: "1 øvelse"
    timeout: 30000
- tapOn: "1 øvelse"
- extendedWaitUntil:
    visible: "Fullført økt"
    timeout: 30000
- assertVisible: "80 kg · 5 repetisjoner"

# Restart and verify that completed history remains browsable.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Tidligere økter"
- extendedWaitUntil:
    visible: "1 øvelse"
    timeout: 30000
