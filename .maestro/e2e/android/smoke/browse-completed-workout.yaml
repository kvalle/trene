appId: com.kjetilvalle.trene
name: Browse a completed workout
tags:
  - smoke
  - android
---
- launchApp

- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 120000
- tapOn: "Tidligere treninger"
- assertVisible: "Ingen fullførte treninger ennå"
- assertVisible: "Start trening"
- tapOn: "Start trening"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett første øvelse"

- tapOn:
    id: "exercise-name-input"
- setClipboard: "Knebøy"
- pasteText
- tapOn:
    id: "create-exercise-submit"

- tapOn: "Rediger sett 1 for Knebøy"
- scrollUntilVisible:
    element:
      text: "Belastning for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Belastning for Knebøy"
- inputText: "80"
- runFlow:
    when:
      notVisible: "^80$"
    commands:
      - tapOn: "Belastning for Knebøy"
      - eraseText
      - inputText: "80"
- assertVisible: "^80$"
- scrollUntilVisible:
    element:
      text: "Repetisjoner for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Repetisjoner for Knebøy"
- inputText: "5"
- runFlow:
    when:
      notVisible: "^5$"
    commands:
      - tapOn: "Repetisjoner for Knebøy"
      - eraseText
      - inputText: "5"
- assertVisible: "^5$"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Marker sett 1 som gjennomført for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Marker sett 1 som gjennomført for Knebøy"
- extendedWaitUntil:
    visible: "80 kg · 5 repetisjoner"
    timeout: 30000
- tapOn: "Ferdig"
- extendedWaitUntil:
    visible: "Fullfør treningen?"
    timeout: 30000
- tapOn: "Fullfør trening"
- extendedWaitUntil:
    visible: "Fullført trening"
    timeout: 30000
- assertVisible: "Knebøy"
- tapOn: "Tilbake til forsiden"
- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 30000

- tapOn: "Tidligere treninger"
- extendedWaitUntil:
    visible: "1 øvelse"
    timeout: 30000
- tapOn: "1 øvelse"
- extendedWaitUntil:
    visible: "Fullført trening"
    timeout: 30000
- assertVisible: "80 kg · 5 repetisjoner"

# Restart and verify that completed history remains browsable.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 120000
- tapOn: "Tidligere treninger"
- extendedWaitUntil:
    visible: "1 øvelse"
    timeout: 30000
