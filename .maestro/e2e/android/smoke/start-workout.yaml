appId: com.kjetilvalle.trene
name: Start and persist a workout
tags:
  - smoke
  - android
---
- launchApp

- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 120000
- tapOn: "Start trening"
- assertVisible: "Ingen øvelser lagt til ennå"
- assertNotVisible: "Ferdig"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett første øvelse"

- tapOn:
    id: "exercise-name-input"
- setClipboard: "Knebøy"
- pasteText
- tapOn:
    id: "create-exercise-submit"

- assertVisible: "Knebøy"
- assertVisible: "Planlagt"
- assertVisible: "Rediger sett 1 for Knebøy"

- tapOn: "Rediger sett 1 for Knebøy"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Repetisjoner for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Repetisjoner for Knebøy"
- inputText: "5"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Repetisjoner for Knebøy"
    direction: DOWN
    centerElement: true
- assertVisible: "^5$"
- scrollUntilVisible:
    element:
      text: "Belastning for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Belastning for Knebøy"
- inputText: "80.5"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Belastning for Knebøy"
    direction: DOWN
    centerElement: true
- assertVisible: "^80\\.5$"
- scrollUntilVisible:
    element:
      text: "Repetisjoner for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Repetisjoner for Knebøy"
- extendedWaitUntil:
    visible: "80,5 kg · 5 repetisjoner"
    timeout: 30000
- pressKey: back

# Background and resume before confirmation to verify planned values are durable.
- pressKey: HOME
- launchApp
- extendedWaitUntil:
    visible: "Fortsett trening"
    timeout: 120000
- tapOn: "Fortsett trening"
- assertVisible: "Knebøy"
- tapOn: "Knebøy"
- assertVisible: "80,5 kg · 5 repetisjoner"
- assertVisible: "Planlagt"

- scrollUntilVisible:
    element:
      text: "Marker sett 1 som gjennomført for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Marker sett 1 som gjennomført for Knebøy"
- extendedWaitUntil:
    visible: "80,5 kg · 5 repetisjoner"
    timeout: 30000
- assertVisible: "Gjennomført"

# Restart the native process without clearing SQLite.
- stopApp
- launchApp

- extendedWaitUntil:
    visible: "Fortsett trening"
    timeout: 120000
- tapOn: "Fortsett trening"
- assertVisible: "Knebøy"
- tapOn: "Knebøy"
- assertVisible: "80,5 kg · 5 repetisjoner"
- assertVisible: "Gjennomført"
- tapOn: "Endre sett 1 til planlagt for Knebøy"
- extendedWaitUntil:
    visible: "Marker sett 1 som gjennomført for Knebøy"
    timeout: 30000
- assertVisible: "Planlagt"
- tapOn: "Rediger sett 1 for Knebøy"
- assertVisible: "80,5"
- assertVisible: "5"
- tapOn: "Lukk redigering av sett 1 for Knebøy"
- tapOn: "Marker sett 1 som gjennomført for Knebøy"
- extendedWaitUntil:
    visible: "80,5 kg · 5 repetisjoner"
    timeout: 30000
- assertVisible: "Gjennomført"

- tapOn: "Avbryt"
- assertVisible: "Avbryt treningen?"
- assertVisible: "Treningen slettes permanent og vises ikke i historikken."
- tapOn: "Behold treningen"
- assertVisible: "Knebøy"

- tapOn: "Avbryt"
- tapOn: "Avbryt treningen"
- extendedWaitUntil:
    visible: "Start trening"
    timeout: 30000
