appId: com.kjetilvalle.trene
name: Delete a completed workout
tags:
  - smoke
  - android
---
- launchApp

- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 120000
- tapOn: "Start trening"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett første øvelse"
- tapOn:
    id: "exercise-name-input"
- setClipboard: "Knebøy"
- pasteText
- tapOn:
    id: "create-exercise-submit"
- tapOn: "Belastning"
- inputText: "80"
- scrollUntilVisible:
    element:
      text: "Repetisjoner"
    direction: DOWN
    centerElement: true
- tapOn: "Repetisjoner"
- inputText: "5"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Bekreft planlagt sett for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Bekreft planlagt sett for Knebøy"
- extendedWaitUntil:
    visible: "80 kg · 5 repetisjoner"
    timeout: 30000
- tapOn: "Ferdig"
- extendedWaitUntil:
    visible: "Fullfør trening"
    timeout: 30000
- tapOn: "Fullfør trening"
- extendedWaitUntil:
    visible: "Fullført trening"
    timeout: 30000

# Cancellation keeps the completed workout available.
- tapOn: "Slett trening"
- extendedWaitUntil:
    visible: "Slett fullført trening?"
    timeout: 30000
- tapOn: "Avbryt"
- extendedWaitUntil:
    notVisible: "Slett fullført trening?"
    timeout: 30000
- assertVisible: "Fullført trening"

# The destructive confirmation removes it and returns to empty history.
- tapOn: "Slett trening"
- tapOn: "Slett"
- extendedWaitUntil:
    visible: "Ingen fullførte treninger ennå"
    timeout: 30000
