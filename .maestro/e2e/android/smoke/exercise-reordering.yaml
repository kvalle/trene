appId: com.kjetilvalle.trene
name: Reorder active workout exercises by touch
tags:
  - smoke
  - android
  - exercise-reordering
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 120000
- tapOn: "Start trening"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett første øvelse"
- tapOn:
    id: "exercise-name-input"
- inputText: "Alpha"
- tapOn:
    id: "create-exercise-submit"
- tapOn: "Alpha, 0 av 1 sett gjennomført, ikke fullført"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett øvelse"
- tapOn:
    id: "exercise-name-input"
- inputText: "Bravo"
- tapOn:
    id: "create-exercise-submit"
- tapOn: "Bravo, 0 av 1 sett gjennomført, ikke fullført"
- swipe:
    start: 50%, 37%
    end: 50%, 25%
    duration: 1500
- assertNotVisible: "Rediger sett 1 for Bravo"
- waitForAnimationToEnd
- tapOn:
    point: 50%, 25%
- assertVisible: "Rediger sett 1 for Bravo"
