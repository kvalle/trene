appId: com.kjetilvalle.trene
name: Active workout compact editing and destructive removal
tags:
  - smoke
  - android
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 120000
- tapOn: "Start trening"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett første øvelse"
- tapOn:
    id: "exercise-name-input"
- setClipboard: "Knebøy"
- pasteText
- tapOn:
    id: "create-exercise-submit"
- extendedWaitUntil:
    visible: "Rediger sett 1 for Knebøy"
    timeout: 30000
- assertVisible: "Planlagt"
- tapOn: "Rediger sett 1 for Knebøy"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Repetisjoner for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Repetisjoner for Knebøy"
- inputText: "5"
- assertVisible: "^5$"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Belastning for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Belastning for Knebøy"
- inputText: "80"
- assertVisible: "^80$"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Repetisjoner for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Repetisjoner for Knebøy"
- extendedWaitUntil:
    visible: "80 kg · 5 repetisjoner"
    timeout: 30000
- pressKey: back
- tapOn: "Lukk redigering av sett 1 for Knebøy"
- extendedWaitUntil:
    visible: "80 kg · 5 repetisjoner"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Marker sett 1 som gjennomført for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Marker sett 1 som gjennomført for Knebøy"
- extendedWaitUntil:
    visible: "80 kg · 5 repetisjoner"
    timeout: 30000
- assertVisible: "Gjennomført"

# Editing a completed set is independent from status and saves it atomically.
- tapOn: "Rediger sett 1 for Knebøy"
- inputText: "2"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Belastning for Knebøy"
    direction: DOWN
    centerElement: true
- assertVisible: "^802$"
- scrollUntilVisible:
    element:
      text: "Repetisjoner for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Repetisjoner for Knebøy"
- extendedWaitUntil:
    visible: "802 kg · 5 repetisjoner"
    timeout: 30000
- pressKey: back
- tapOn: "Lukk redigering av sett 1 for Knebøy"
- extendedWaitUntil:
    visible: "802 kg · 5 repetisjoner"
    timeout: 30000
- assertVisible: "Gjennomført"

# Cancellation remains non-destructive when the user keeps the workout.
- tapOn: "Avbryt"
- extendedWaitUntil:
    visible: "Avbryt treningen?"
    timeout: 10000
- tapOn: "Behold treningen"

# Adding a set leaves a compact planned row in stable insertion order.
- tapOn: "Legg til sett"
- assertVisible: "Rediger sett 2 for Knebøy"
- assertVisible: "Planlagt"
- scrollUntilVisible:
    element:
      text: "Legg til sett"
    direction: DOWN
- assertVisible:
    text: "Legg til sett"
    enabled: true
- tapOn: "Marker sett 2 som gjennomført for Knebøy"
- extendedWaitUntil:
    visible: "Endre sett 2 til planlagt for Knebøy"
    timeout: 30000
- assertVisible: "Rediger sett 1 for Knebøy"

# Completed removal requires confirmation; cancellation retains the row.
- tapOn: "Rediger sett 2 for Knebøy"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Fjern sett 2 for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Fjern sett 2 for Knebøy"
- assertVisible: "Fjern gjennomført sett?"
- tapOn: "Behold settet"
- assertVisible: "Lukk redigering av sett 2 for Knebøy"
- scrollUntilVisible:
    element:
      text: "Fjern sett 2 for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Fjern sett 2 for Knebøy"
- tapOn: "Bekreft fjerning av gjennomført sett"
- extendedWaitUntil:
    notVisible: "Rediger sett 2 for Knebøy"
    timeout: 30000
- assertVisible: "Rediger sett 1 for Knebøy"
- assertVisible: "802 kg · 5 repetisjoner"
