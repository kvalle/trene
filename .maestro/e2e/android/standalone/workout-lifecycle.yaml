appId: com.kjetilvalle.trene
name: Qualify the standalone offline MVP lifecycle
tags:
  - qualification
  - android
  - offline
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 120000
- tapOn: "Start trening"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett første øvelse"
- tapOn:
    id: "exercise-name-input"
- setClipboard: "Knebøy"
- pasteText
- tapOn:
    id: "create-exercise-submit"
- tapOn: "Belastning"
- inputText: "80.5"
- scrollUntilVisible:
    element:
      text: "Repetisjoner"
    direction: DOWN
    centerElement: true
- tapOn: "Repetisjoner"
- inputText: "5"
- pressKey: back
- scrollUntilVisible:
    element:
      text: "Bekreft planlagt sett for Knebøy"
    direction: DOWN
    centerElement: true
- tapOn: "Bekreft planlagt sett for Knebøy"
- extendedWaitUntil:
    visible: "80,5 kg · 5 repetisjoner"
    timeout: 30000

# Force-stop after confirmation to prove that the accepted set survives.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Fortsett trening"
    timeout: 120000
- tapOn: "Fortsett trening"
- assertVisible: "80,5 kg · 5 repetisjoner"

# Force-stop again, then finish and inspect both history views.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Fortsett trening"
    timeout: 120000
- tapOn: "Fortsett trening"
- assertVisible: "80,5 kg · 5 repetisjoner"
- tapOn: "Ferdig"
- extendedWaitUntil:
    visible: "Fullfør trening"
    timeout: 30000
- tapOn: "Fullfør trening"
- extendedWaitUntil:
    visible: "Fullført trening"
    timeout: 30000
- assertVisible: "80,5 kg · 5 repetisjoner"
- tapOn: "Tilbake til forsiden"
- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 30000
- tapOn: "Tidligere treninger"
- extendedWaitUntil:
    visible: "1 øvelse"
    timeout: 30000
- back
- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 30000
- tapOn: "Øvelser"
- extendedWaitUntil:
    visible: "Brukt i 1 trening"
    timeout: 30000
- tapOn: "Knebøy"
- extendedWaitUntil:
    visible: "80,5 kg · 5 repetisjoner"
    timeout: 30000
