appId: com.kjetilvalle.trene
name: Delete and restore all training data on iOS
tags:
  - ios
  - backup-restore
  - sqlite
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 120000
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- tapOn:
    id: "restore-from-file"
- runFlow:
    file: select-backup-file.yaml
    env:
      BACKUP_FILE: representative.trene-backup
- extendedWaitUntil:
    visible:
      id: "restore-preview"
    timeout: 30000
- tapOn:
    id: "continue-restore"
- tapOn:
    id: "confirm-restore"
- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 30000
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- tapOn:
    id: "delete-training-data"
- tapOn:
    id: "open-delete-training-data-confirmation"
- assertVisible: "Alle treningsøkter, inkludert en eventuell aktiv trening, og alle øvelser slettes permanent. Lag en sikkerhetskopi først hvis du vil beholde dataene."
- tapOn:
    id: "cancel-delete-training-data"
- tapOn:
    id: "open-delete-training-data-confirmation"
- tapOn:
    id: "confirm-delete-training-data"
- extendedWaitUntil:
    visible: "Start trening"
    timeout: 30000
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- tapOn:
    id: "delete-training-data"
- assertNotVisible:
    id: "open-delete-training-data-confirmation"
- tapOn:
    point: "8%,8%"
- tapOn:
    point: "8%,8%"
- tapOn: "Øvelser"
- assertVisible: "Opprett første øvelse"
- tapOn:
    point: "8%,8%"
- tapOn: "Tidligere treninger"
- assertVisible: "Ingen fullførte treninger ennå"
- tapOn:
    point: "8%,8%"
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- tapOn:
    id: "restore-from-file"
- runFlow:
    file: select-backup-file.yaml
    env:
      BACKUP_FILE: representative.trene-backup
- extendedWaitUntil:
    visible:
      id: "restore-preview"
    timeout: 30000
- tapOn:
    id: "continue-restore"
- tapOn:
    id: "confirm-restore"
- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 30000
- tapOn: "Øvelser"
- assertVisible: "Knebøy.*"
- assertVisible: "Markløft.*"
