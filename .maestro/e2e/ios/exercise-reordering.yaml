appId: com.kjetilvalle.trene
name: Reorder active workout exercises by touch on iOS
tags:
  - ios
  - exercise-reordering
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en trening?"
    timeout: 120000
- tapOn: "Start trening"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett første øvelse"
- tapOn:
    id: "exercise-name-input"
- inputText: "Alpha"
- tapOn:
    id: "create-exercise-submit"
- tapOn: "Alpha, 0 av 1 sett gjennomført, ikke fullført"
- tapOn: "Legg til øvelse"
- tapOn: "Opprett øvelse"
- tapOn:
    id: "exercise-name-input"
- inputText: "Bravo"
- tapOn:
    id: "create-exercise-submit"
- tapOn: "Bravo, 0 av 1 sett gjennomført, ikke fullført"
- swipe:
    start: 50%, 38%
    end: 50%, 55%
    duration: 1600
- stopApp
- launchApp
- tapOn: "Fortsett trening"
- assertVisible: "Alpha, 0 av 1 sett gjennomført, ikke fullført"
- assertVisible: "Bravo, 0 av 1 sett gjennomført, ikke fullført"
