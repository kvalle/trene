appId: com.kjetilvalle.trene
name: Cancel iOS backup selection
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- tapOn:
    id: "restore-from-file"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 30000
- tapOn:
    point: "76%,13%"
- extendedWaitUntil:
    visible:
      id: "restore-from-file"
    timeout: 30000
- assertNotVisible:
    id: "data-error"
