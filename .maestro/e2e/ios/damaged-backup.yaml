appId: com.kjetilvalle.trene
name: Reject a damaged backup on iOS
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Øvelser"
- extendedWaitUntil:
    visible: "Opprett første øvelse"
    timeout: 30000
- tapOn: "Opprett første øvelse"
- runFlow:
    when:
      notVisible: "Opprett øvelse"
    commands:
      - runFlow:
          when:
            visible: "Opprett første øvelse"
          commands:
            - tapOn: "Opprett første øvelse"
- extendedWaitUntil:
    visible: "Opprett øvelse"
    timeout: 30000
- tapOn:
    point: "50%,31%"
- inputText: "Beholdes"
- assertVisible: "Beholdes"
- tapOn:
    id: "create-exercise-submit"
- extendedWaitUntil:
    visible: "Beholdes"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- tapOn:
    id: "restore-from-file"
- runFlow:
    file: select-backup-file.yaml
    env:
      BACKUP_FILE: damaged.trene-backup
- extendedWaitUntil:
    visible:
      id: "data-error"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 30000
- tapOn: "Øvelser"
- assertVisible: "Beholdes.*"
