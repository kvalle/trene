appId: com.kjetilvalle.trene
name: Roll back a failed iOS restore
tags:
  - ios
  - backup-restore
---
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 120000
- tapOn: "Øvelser"
- extendedWaitUntil:
    visible: "Opprett første øvelse"
    timeout: 30000
- tapOn: "Opprett første øvelse"
- extendedWaitUntil:
    visible: "Opprett øvelse"
    timeout: 30000
- tapOn:
    point: "50%,31%"
- inputText: "B"
- assertVisible: "^B$"
- tapOn:
    id: "create-exercise-submit"
- extendedWaitUntil:
    visible: "B"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 60000
- tapOn: "Start økt"
- tapOn: "Legg til øvelse"
- tapOn: "B"
- tapOn: "Belastning for B"
- inputText: "42.5"
- assertVisible: "^42\\.5$"
- tapOn: "Repetisjoner for B"
- inputText: "6"
- assertVisible: "^6$"
- tapOn: "Planlagt sett"
- extendedWaitUntil:
    visible: "Bekreft planlagt sett for B"
    timeout: 30000
- tapOn: "Bekreft planlagt sett for B"
- extendedWaitUntil:
    visible: "Sett 1, 6 repetisjoner med 42,5 kilogram"
    timeout: 30000
- extendedWaitUntil:
    visible: "Ferdig"
    timeout: 30000
- tapOn: "Ferdig"
- runFlow:
    when:
      notVisible: "Fullfør økt"
    commands:
      - runFlow:
          when:
            visible: "Ferdig"
          commands:
            - tapOn: "Ferdig"
- extendedWaitUntil:
    visible: "Fullfør økt"
    timeout: 30000
- tapOn: "Fullfør økt"
- tapOn: "Tilbake til forsiden"
- tapOn: "Innstillinger"
- tapOn:
    id: "settings-data"
- tapOn:
    id: "restore-from-file"
- runFlow:
    file: select-backup-file.yaml
    env:
      BACKUP_FILE: representative.trene-backup
- extendedWaitUntil:
    visible:
      id: "restore-preview"
    timeout: 30000
- tapOn:
    id: "continue-restore"
- extendedWaitUntil:
    visible:
      id: "restore-confirmation"
    timeout: 30000
- tapOn:
    id: "confirm-restore"
- extendedWaitUntil:
    visible:
      id: "data-error"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 60000
- tapOn: "Øvelser"
- assertVisible: "B.*"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Klar for en økt?"
    timeout: 60000
- tapOn: "Tidligere økter"
- tapOn: ".*, 1 øvelse"
- assertVisible: "Sett 1, 6 repetisjoner med 42,5 kilogram"
