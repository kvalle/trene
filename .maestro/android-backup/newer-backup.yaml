appId: com.kjetilvalle.trene
name: Reject a newer Android backup
---
- launchApp
- extendedWaitUntil: { visible: "Klar for en økt?", timeout: 120000 }
- tapOn: "Øvelser"
- tapOn: "Opprett første øvelse"
- tapOn: { id: "exercise-name-input" }
- inputText: "Beholdes"
- tapOn: { id: "create-exercise-submit" }
- back
- back
- tapOn: "Innstillinger"
- tapOn: { id: "settings-data" }
- tapOn: { id: "restore-from-file" }
- runFlow:
    file: select-backup-file.yaml
    env: { BACKUP_FILE: "representative.trene-backup" }
- extendedWaitUntil: { visible: "Sikkerhetskopien krever en nyere versjon av Trene. Dataene dine er ikke endret.", timeout: 30000 }
- back
- back
- tapOn: "Øvelser"
- assertVisible: "Beholdes"
