appId: com.kjetilvalle.trene
name: Cancel Android backup selection
---
- launchApp
- extendedWaitUntil: { visible: "Klar for en økt?", timeout: 120000 }
- tapOn: "Innstillinger"
- waitForAnimationToEnd
- tapOn: { id: "settings-data" }
- waitForAnimationToEnd
- tapOn: { id: "restore-from-file" }
- waitForAnimationToEnd
- assertVisible: "Show roots"
- pressKey: BACK
- assertVisible: { id: "restore-from-file" }
- assertNotVisible: { id: "data-error" }
