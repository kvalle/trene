name: Backup release qualification

on:
  workflow_dispatch:
    inputs:
      candidate-commit:
        description: Full SHA of the release candidate checked out by this run
        required: true
        type: string
      ci-run-id:
        description: Successful CI run for the same commit; its APK is reused
        required: true
        type: string
      accept-release:
        description: Validate committed evidence instead of running qualification
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: backup-release-qualification-${{ inputs.candidate-commit }}
  cancel-in-progress: false

env:
  ANDROID_SMOKE_APK: .artifacts/android/trene.apk
  JAVA_VERSION: '17'
  MAESTRO_VERSION: 2.8.0

jobs:
  evidence:
    name: Validate candidate and evidence
    runs-on: ubuntu-latest
    outputs:
      ci-run-id: ${{ steps.candidate.outputs.ci-run-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate exact candidate and authoritative CI
        id: candidate
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate-commit }}
          CI_RUN_ID: ${{ inputs.ci-run-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${{ inputs.accept-release }}" == "true" ]]; then
            git merge-base --is-ancestor "$CANDIDATE_COMMIT" "$GITHUB_SHA"
            git diff --quiet "$CANDIDATE_COMMIT" "$GITHUB_SHA" -- . \
              ':(exclude)docs/specs/manual-backup-and-restore-qualification.json' \
              ':(exclude)docs/qualification-evidence/**'
          else
            test "$CANDIDATE_COMMIT" = "$GITHUB_SHA"
          fi
          run="$(gh api "/repos/${{ github.repository }}/actions/runs/$CI_RUN_ID")"
          artifacts="$(gh api "/repos/${{ github.repository }}/actions/runs/$CI_RUN_ID/artifacts")"
          printf '%s' "$run" > "$RUNNER_TEMP/ci-run.json"
          printf '%s' "$artifacts" > "$RUNNER_TEMP/ci-artifacts.json"
          node scripts/verify-ci-evidence.mjs run "$CANDIDATE_COMMIT" "$CI_RUN_ID" \
            "$RUNNER_TEMP/ci-run.json" "$RUNNER_TEMP/ci-artifacts.json"
          echo "ci-run-id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Validate qualification record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.accept-release }}
        run: |
          if [[ "$RELEASE_MODE" == "true" ]]; then
            npm run qualify:backup:record -- --release
            target_commit="$(jq -r .release.targetCommit docs/specs/manual-backup-and-restore-qualification.json)"
            test "$target_commit" = "${{ inputs.candidate-commit }}"
            expected_workflow="$(jq -r .release.acceptanceWorkflowSha256 docs/specs/manual-backup-and-restore-qualification.json)"
            actual_workflow="$(sha256sum .github/workflows/release-qualification.yml | cut -d ' ' -f 1)"
            test "$actual_workflow" = "$expected_workflow"
            run_url="$(jq -r .automated.workflowUrl docs/specs/manual-backup-and-restore-qualification.json)"
            run_id="${run_url##*/}"
            run="$(gh api "/repos/${{ github.repository }}/actions/runs/$run_id")"
            printf '%s' "$run" > "$RUNNER_TEMP/qualification-run.json"
            node scripts/verify-ci-evidence.mjs qualification "$target_commit" "$run_id" \
              "$RUNNER_TEMP/qualification-run.json"
          else
            npm run qualify:backup:record
          fi

  android-maximum-os:
    name: Android maximum supported OS (API 36)
    if: inputs.accept-release != true
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v7
        with:
          name: trene-android-apk
          path: .artifacts/android
          github-token: ${{ github.token }}
          run-id: ${{ needs.evidence.outputs.ci-run-id }}
      - name: Verify APK provenance
        run: node scripts/verify-ci-evidence.mjs apk "$GITHUB_SHA" "${{ needs.evidence.outputs.ci-run-id }}" .artifacts/android/apk-identity.json "$ANDROID_SMOKE_APK"
      - name: Create deterministic input package
        run: node scripts/create-ios-smoke-fixtures.mjs .artifacts/supported-os/input
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_API_LEVEL: '36'
          CROSS_PLATFORM_BACKUP_INPUT: .artifacts/supported-os/input/representative.trene-backup
          CROSS_PLATFORM_BACKUP_OUTPUT: .artifacts/supported-os/output/package.trene-backup
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          script: bash scripts/android-e2e-readiness.sh && adb install "$ANDROID_SMOKE_APK" && npm run e2e:android:backup
      - name: Upload safe diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-api-36-diagnostics
          path: .artifacts/android/runtime-metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload safe failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: android-api-36-failure-diagnostics
          path: |
            .artifacts/maestro-android-backup/debug/
            .artifacts/maestro-android-backup/screenshots/
            .artifacts/android-readiness/
          if-no-files-found: ignore
          retention-days: 7

  android-first:
    name: Android produces A-I-A package
    if: inputs.accept-release != true
    needs: evidence
    uses: ./.github/workflows/cross-platform-android.yml
    with:
      android-apk-run-id: ${{ needs.evidence.outputs.ci-run-id }}
      input-artifact: ''
      output-artifact: android-ios-android-1

  ios-middle:
    name: iOS restores A-I-A package
    needs: android-first
    uses: ./.github/workflows/cross-platform-ios.yml
    with:
      input-artifact: android-ios-android-1
      output-artifact: android-ios-android-2
      expected-metadata-artifact: android-ios-android-1-metadata

  android-last:
    name: Android completes A-I-A cycle
    needs: [evidence, ios-middle]
    uses: ./.github/workflows/cross-platform-android.yml
    with:
      android-apk-run-id: ${{ needs.evidence.outputs.ci-run-id }}
      input-artifact: android-ios-android-2
      output-artifact: android-ios-android-3
      expected-metadata-artifact: android-ios-android-2-metadata

  ios-first:
    name: iOS produces I-A-I package
    if: inputs.accept-release != true
    needs: evidence
    uses: ./.github/workflows/cross-platform-ios.yml
    with:
      input-artifact: ''
      output-artifact: ios-android-ios-1

  android-middle:
    name: Android restores I-A-I package
    needs: [evidence, ios-first]
    uses: ./.github/workflows/cross-platform-android.yml
    with:
      android-apk-run-id: ${{ needs.evidence.outputs.ci-run-id }}
      input-artifact: ios-android-ios-1
      output-artifact: ios-android-ios-2
      expected-metadata-artifact: ios-android-ios-1-metadata

  ios-last:
    name: iOS completes I-A-I cycle
    needs: android-middle
    uses: ./.github/workflows/cross-platform-ios.yml
    with:
      input-artifact: ios-android-ios-2
      output-artifact: ios-android-ios-3
      expected-metadata-artifact: ios-android-ios-2-metadata

  qualification:
    name: Qualify release candidate
    if: always() && inputs.accept-release != true
    needs: [evidence, android-maximum-os, android-last, ios-last]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release-specific gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"

  acceptance:
    name: Accept backup-enabled release
    if: always() && inputs.accept-release == true
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.evidence.result }}' = success
