name: iOS E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-app:
    name: iOS simulator app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:ios:smoke
      - name: Upload simulator app
        uses: actions/upload-artifact@v6
        with:
          name: trene-ios-simulator-app
          path: .artifacts/ios/derived-data/Build/Products/Release-iphonesimulator/Trene.app
          if-no-files-found: error
          retention-days: 1

  ios-runtime:
    name: iOS ${{ matrix.shard }} verification
    needs: ios-app
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: restore
            flows: restore-success,damaged-backup,picker-cancellation
          - shard: recovery
            flows: restore-failure,newer-backup
          - shard: fail-safe
            flows: rollback-failure,storage-failure,share-cancellation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.8.0
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v7
        with:
          name: trene-ios-simulator-app
          path: .artifacts/ios/Trene.app
      - name: Run native backup and restore journeys
        env:
          IOS_SIMULATOR_DEVICE: iPhone 16
          IOS_E2E_APP: .artifacts/ios/Trene.app
          IOS_SIMULATOR_RUNTIME: '26'
          IOS_E2E_FLOWS: ${{ matrix.flows }}
          IOS_E2E_SHARD: ${{ matrix.shard }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
        run: npm run e2e:ios
      - name: Upload safe iOS diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: ios-runtime-diagnostics-${{ matrix.shard }}
          path: |
            .artifacts/ios/*.json
            .artifacts/ios/*.log
            .artifacts/ios/readiness/
            .artifacts/maestro-ios/debug/
            .artifacts/maestro-ios/screenshots/
          if-no-files-found: ignore
          retention-days: 7
