name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SMOKE_APK: .artifacts/android/app-debug.apk
  ANDROID_ARCH: x86_64
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_COMPILE_SDK: '36'
  ANDROID_CMAKE: 3.22.1
  ANDROID_NDK: 27.1.12297006
  ANDROID_SMOKE_APK_CACHE_VERSION: v3
  GRADLE_USER_HOME: /home/runner/.gradle
  GRADLE_VERSION: 9.3.1
  JAVA_VERSION: '17'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  android-apk:
    name: Android smoke APK
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      apk-cache-hit: ${{ steps.android-smoke-apk.outputs.cache-hit }}
      apk-cache-key: ${{ steps.android-smoke-apk.outputs.cache-primary-key }}
      gradle-cache-hit: ${{ steps.gradle-build-cache.outputs.cache-hit }}
      gradle-cache-key: ${{ steps.gradle-build-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: caches/build-cache-1
      - run: npm ci

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-${{ env.ANDROID_COMPILE_SDK }}' 'build-tools;${{ env.ANDROID_BUILD_TOOLS }}' 'cmake;${{ env.ANDROID_CMAKE }}' 'ndk;${{ env.ANDROID_NDK }}'

      - name: Restore Gradle build cache
        id: gradle-build-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          key: gradle-build-v2-${{ runner.os }}-${{ env.ANDROID_ARCH }}-gradle${{ env.GRADLE_VERSION }}-jdk${{ env.JAVA_VERSION }}-sdk${{ env.ANDROID_COMPILE_SDK }}-tools${{ env.ANDROID_BUILD_TOOLS }}-cmake${{ env.ANDROID_CMAKE }}-ndk${{ env.ANDROID_NDK }}-${{ hashFiles('package.json', 'package-lock.json', 'app.json', 'app.config.*', 'plugins/**', '.nvmrc', 'scripts/build-android-smoke-apk.sh') }}-${{ github.sha }}
          restore-keys: |
            gradle-build-v2-${{ runner.os }}-${{ env.ANDROID_ARCH }}-gradle${{ env.GRADLE_VERSION }}-jdk${{ env.JAVA_VERSION }}-sdk${{ env.ANDROID_COMPILE_SDK }}-tools${{ env.ANDROID_BUILD_TOOLS }}-cmake${{ env.ANDROID_CMAKE }}-ndk${{ env.ANDROID_NDK }}-${{ hashFiles('package.json', 'package-lock.json', 'app.json', 'app.config.*', 'plugins/**', '.nvmrc', 'scripts/build-android-smoke-apk.sh') }}-

      - name: Restore Android smoke APK
        id: android-smoke-apk
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.ANDROID_SMOKE_APK }}
          key: android-smoke-apk-${{ env.ANDROID_SMOKE_APK_CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'app.json', 'app.config.*', 'eas.json', '.nvmrc', 'locales/**', 'assets/**', 'plugins/**', 'android/**', 'scripts/build-android-smoke-apk.sh', '.github/workflows/ci.yml') }}

      - name: Build Android smoke APK
        if: steps.android-smoke-apk.outputs.cache-hit != 'true'
        run: bash scripts/build-android-smoke-apk.sh

      - name: Upload Android smoke APK
        uses: actions/upload-artifact@v6
        with:
          name: android-smoke-apk
          path: ${{ env.ANDROID_SMOKE_APK }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload Android build report
        if: always() && steps.android-smoke-apk.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: android-build-report
          path: .artifacts/android/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Gradle build cache
        if: steps.android-smoke-apk.outputs.cache-hit != 'true' && steps.gradle-build-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: gradle-build-cache
          path: ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  android-smoke:
    name: Android smoke tests
    needs: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - run: npm ci

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.8.0
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Android smoke APK
        uses: actions/download-artifact@v7
        with:
          name: android-smoke-apk
          path: .artifacts/android

      - name: Install app and run smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          disk-size: 1024M
          script: bash scripts/ci-android-smoke.sh

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-smoke-diagnostics
          path: |
            .artifacts/maestro/debug/
            .artifacts/metro.log
            .artifacts/logcat.txt
            .artifacts/activity-processes.txt
            .artifacts/meminfo.txt
            .artifacts/window.txt
            .artifacts/runner-disk.txt
            .artifacts/runner-memory.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Android smoke APK
        if: success() && needs.android-apk.outputs.apk-cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.ANDROID_SMOKE_APK }}
          key: ${{ needs.android-apk.outputs.apk-cache-key }}

      - name: Download Gradle build cache
        if: success() && needs.android-apk.outputs.apk-cache-hit != 'true' && needs.android-apk.outputs.gradle-cache-hit != 'true'
        uses: actions/download-artifact@v7
        with:
          name: gradle-build-cache
          path: ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1

      - name: Save Gradle build cache
        if: success() && needs.android-apk.outputs.apk-cache-hit != 'true' && needs.android-apk.outputs.gradle-cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          key: ${{ needs.android-apk.outputs.gradle-cache-key }}
