name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SMOKE_APK: .artifacts/android/app-debug.apk

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  android-smoke:
    name: Android smoke tests
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: caches/build-cache-1
      - run: npm ci

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.8.0
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Gradle build cache
        id: gradle-build-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            gradle-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', '.nvmrc') }}-

      - name: Restore Android smoke APK
        id: android-smoke-apk
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.ANDROID_SMOKE_APK }}
          key: android-smoke-apk-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'app.json', 'app.config.*', 'eas.json', '.nvmrc', 'locales/**', 'assets/**', 'plugins/**', 'android/**', 'scripts/build-android-smoke-apk.sh', '.github/workflows/ci.yml') }}

      - name: Build Android smoke APK
        if: steps.android-smoke-apk.outputs.cache-hit != 'true'
        run: bash scripts/build-android-smoke-apk.sh

      - name: Install app and run smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disk-size: 4096M
          profile: pixel_7
          script: bash scripts/ci-android-smoke.sh

      - name: Save tested Android smoke APK
        if: steps.android-smoke-apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.ANDROID_SMOKE_APK }}
          key: ${{ steps.android-smoke-apk.outputs.cache-primary-key }}

      - name: Save Gradle build cache
        if: steps.gradle-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-build-cache.outputs.cache-primary-key }}

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-smoke-diagnostics
          path: |
            .artifacts/maestro/debug/
            .artifacts/metro.log
            .artifacts/logcat.txt
          if-no-files-found: ignore
          retention-days: 7
