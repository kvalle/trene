name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SMOKE_APK: .artifacts/android/trene.apk
  ANDROID_ARCH: universal
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_COMPILE_SDK: '36'
  ANDROID_CMAKE: 3.22.1
  ANDROID_NDK: 27.1.12297006
  GRADLE_USER_HOME: /home/runner/.gradle
  GRADLE_VERSION: 9.3.1
  JAVA_VERSION: '17'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan verification level
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.routes.outputs.android }}
      android-matrix: ${{ steps.matrix.outputs.android }}
      ios: ${{ steps.routes.outputs.ios }}
      ios-matrix: ${{ steps.matrix.outputs.ios }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed behavior
        id: routes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' package.json | node scripts/plan-ci.mjs >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | node scripts/plan-ci.mjs >> "$GITHUB_OUTPUT"
          fi
      - name: Build Android matrix
        id: matrix
        env:
          MODE: ${{ steps.routes.outputs.android }}
        run: |
          if [[ "$MODE" == "full" ]]; then
            matrix='["standalone","export-cleanup","before-replacement","around-activation","after-replacement"]'
          elif [[ "$MODE" == "representative" ]]; then
            matrix='["representative"]'
          else
            matrix='[]'
          fi
          echo "android=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.routes.outputs.ios }}" == "full" ]]; then
            ios='[{"shard":"restore","flows":"restore-success,damaged-backup,picker-cancellation"},{"shard":"recovery","flows":"restore-failure,newer-backup"},{"shard":"fail-safe","flows":"rollback-failure,storage-failure,share-cancellation"}]'
          elif [[ "${{ steps.routes.outputs.ios }}" == "representative" ]]; then
            ios='[{"shard":"representative","flows":"restore-success"}]'
          else
            ios='[]'
          fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  test:
    name: Typecheck and unit tests
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run test:ci-plan
      - run: npm run qualify:backup:record

  android-apk:
    name: Standalone Android APK
    needs: [plan, test]
    if: needs.plan.outputs.android != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      gradle-cache-hit: ${{ steps.gradle-build-cache.outputs.cache-hit }}
      gradle-cache-key: ${{ steps.gradle-build-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: caches/build-cache-1
      - run: npm ci
      - run: sdkmanager 'platforms;android-${{ env.ANDROID_COMPILE_SDK }}' 'build-tools;${{ env.ANDROID_BUILD_TOOLS }}' 'cmake;${{ env.ANDROID_CMAKE }}' 'ndk;${{ env.ANDROID_NDK }}'
      - name: Restore Gradle build cache
        id: gradle-build-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          key: gradle-build-v2-${{ runner.os }}-${{ env.ANDROID_ARCH }}-gradle${{ env.GRADLE_VERSION }}-jdk${{ env.JAVA_VERSION }}-sdk${{ env.ANDROID_COMPILE_SDK }}-${{ hashFiles('package.json', 'package-lock.json', 'app.json', 'plugins/**', 'scripts/build-android-smoke-apk.sh') }}-${{ github.sha }}
          restore-keys: gradle-build-v2-${{ runner.os }}-${{ env.ANDROID_ARCH }}-gradle${{ env.GRADLE_VERSION }}-jdk${{ env.JAVA_VERSION }}-sdk${{ env.ANDROID_COMPILE_SDK }}-${{ hashFiles('package.json', 'package-lock.json', 'app.json', 'plugins/**', 'scripts/build-android-smoke-apk.sh') }}-
      - name: Build Android smoke APK
        run: bash scripts/build-android-smoke-apk.sh
      - name: Record immutable APK identity
        run: |
          digest="$(shasum -a 256 "$ANDROID_SMOKE_APK" | cut -d ' ' -f 1)"
          jq -n --arg commit "$GITHUB_SHA" --arg sha256 "$digest" --arg runId "$GITHUB_RUN_ID" \
            '{commit:$commit,sha256:$sha256,ciRunId:$runId}' > .artifacts/android/apk-identity.json
      - uses: actions/upload-artifact@v6
        with:
          name: trene-android-apk
          path: |
            ${{ env.ANDROID_SMOKE_APK }}
            .artifacts/android/apk-identity.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android build report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-report
          path: .artifacts/android/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Gradle build cache
        if: steps.gradle-build-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: gradle-build-cache
          path: ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  android-smoke:
    name: Android ${{ matrix.suite }} verification
    needs: [plan, android-apk]
    if: needs.plan.outputs.android != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.android-matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.8.0
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v7
        with:
          name: trene-android-apk
          path: .artifacts/android
      - name: Install app offline and run verification
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_QUALIFICATION_SUITE: ${{ matrix.suite }}
        with:
          api-level: 34
          arch: x86_64
          disk-size: 4096M
          profile: pixel_2
          script: bash scripts/ci-android-offline.sh
      - name: Upload safe Android diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: android-diagnostics-${{ matrix.suite }}
          path: |
            .artifacts/maestro/debug/
            .artifacts/maestro-android-backup/debug/
            .artifacts/maestro-android-backup/screenshots/
            .artifacts/android/*metadata.json
            .artifacts/android/accessibility.xml
          if-no-files-found: ignore
          retention-days: 7
  ios-runtime:
    name: iOS ${{ needs.plan.outputs.ios }} verification
    needs: [plan, test]
    if: needs.plan.outputs.ios != 'none'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.8.0
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - run: npm run build:ios:smoke
      - name: Run native backup and restore journeys
        env:
          IOS_SIMULATOR_DEVICE: iPhone 16
          IOS_SIMULATOR_RUNTIME: '26'
          IOS_SMOKE_FLOWS: ${{ needs.plan.outputs.ios == 'full' && 'all' || 'restore-success' }}
          IOS_SMOKE_SHARD: ${{ needs.plan.outputs.ios }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
        run: npm run smoke:ios
      - name: Upload safe iOS diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: ios-runtime-diagnostics-${{ needs.plan.outputs.ios }}
          path: |
            .artifacts/ios/*.json
            .artifacts/ios/*.log
            .artifacts/maestro-ios/debug/
            .artifacts/maestro-ios/screenshots/
          if-no-files-found: ignore
          retention-days: 7
