name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  android-smoke:
    name: Android smoke tests
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_API_LEVEL: '34'
      ANDROID_ARCH: x86_64
      ANDROID_PROFILE: pixel_7
      ANDROID_DISK_SIZE: 4096M
      AVD_CACHE_VERSION: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          # PR caches are branch-scoped, so writes speed up later commits without
          # allowing untrusted PR state to replace main's cache.
          cache-read-only: false
      - run: npm ci

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.8.0
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Android emulator snapshot
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-v${{ env.AVD_CACHE_VERSION }}-api${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_ARCH }}-${{ env.ANDROID_PROFILE }}-${{ env.ANDROID_DISK_SIZE }}

      - name: Create Android emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: ${{ env.ANDROID_ARCH }}
          disk-size: ${{ env.ANDROID_DISK_SIZE }}
          profile: ${{ env.ANDROID_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo 'Created clean Android emulator snapshot.'

      - name: Build app and run smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: ${{ env.ANDROID_ARCH }}
          disk-size: ${{ env.ANDROID_DISK_SIZE }}
          profile: ${{ env.ANDROID_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-android-smoke.sh

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-smoke-diagnostics
          path: |
            .artifacts/maestro/debug/
            .artifacts/metro.log
            .artifacts/logcat.txt
          if-no-files-found: ignore
          retention-days: 7
